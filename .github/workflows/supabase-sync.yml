name: Supabase Database Sync & Migration CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'vec_schema_supabase.sql'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SQL Schema Files
        run: |
          set -e
          echo "Validating VEC PostgreSQL 16 + PostGIS schema..."
          test -f vec_schema_supabase.sql || { echo "vec_schema_supabase.sql not found"; exit 1; }
          test -d supabase/migrations || { echo "supabase/migrations not found"; exit 1; }
          echo "Schema files verified."

      - name: Deploy Migrations to Supabase (Production)
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Skipping automated Supabase deployment: required GitHub Actions secrets are not configured."
            echo "Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push
          echo "Supabase database migrations deployed successfully!"
